# schema.yaml

x-google-marketplace:
  schemaVersion: v2
  applicationApiVersion: v1beta1

  # MUST match the deployer image tag
  publishedVersion: '1.21.0'
  publishedVersionMetadata:
    releaseNote: >-
      Vault Enterprise for GCP Marketplace - Testing Only
    releaseTypes:
      - Feature
    recommended: true

  # Partner and product identifiers (must match Partner Portal)
  partnerId: 0014M00001h317WQAQ
  solutionId: vault

  # All images must be declared here for security scanning
  images:
    vault:
      properties:
        imageVault:
          type: FULL
    vault-init:
      properties:
        imageVaultInit:
          type: FULL
    ubbagent:
      properties:
        imageUbbagent:
          type: FULL

  # Cluster requirements
  clusterConstraints:
    resources:
      - replicas: 1
        requests:
          cpu: 500m
          memory: 256Mi
    k8sVersion: ">=1.21.0"

# ⚠️  TESTING ONLY - NOT FOR PRODUCTION ⚠️ 
# This deployment uses file storage backend with a single replica.
# It is designed for testing and evaluation purposes only.

# User-configurable properties (displayed in Marketplace UI)
properties:
  # Required: App instance name
  name:
    type: string
    x-google-marketplace:
      type: NAME

  # Required: Kubernetes namespace
  namespace:
    type: string
    x-google-marketplace:
      type: NAMESPACE

  # Storage size for PersistentVolume
  storageSize:
    type: string
    title: Storage Size
    description: Size of PersistentVolume for Vault Enterprise data (e.g., 100Gi)
    default: "100Gi"
  storageSize:
    type: string
    title: Storage Size
    description: Size of persistent volume for each Vault pod
    default: "10Gi"

  # Enable Vault UI
  enableUI:
    type: boolean
    title: Enable Vault Web UI
    description: Deploy the Vault web interface
    default: true

  # Enable Vault Agent Injector
  enableInjector:
    type: boolean
    title: Enable Vault Agent Injector
    description: Deploy sidecar injector for automatic secrets injection
    default: true

  # Service account for Vault
  vaultServiceAccount:
    type: string
    title: Vault Enterprise Service Account
    x-google-marketplace:
      type: SERVICE_ACCOUNT
      serviceAccount:
        description: Service account for Vault Enterprise server pods
        roles:
          - type: ClusterRole
            rulesType: CUSTOM
            rules:
              - apiGroups: [""]
                resources: ["secrets"]
                verbs: ["get", "list", "watch", "create", "update", "delete"]
              - apiGroups: [""]
                resources: ["pods"]
                verbs: ["get", "list", "patch", "update"]

  # Vault server resources (user-configurable, conservative defaults for validation)
  vaultResourcesRequestsCpu:
    type: string
    title: Vault Enterprise CPU Request
    description: CPU requested for Vault Enterprise server pod
    default: "500m"
  vaultResourcesRequestsMemory:
    type: string
    title: Vault Enterprise Memory Request
    description: Memory requested for Vault Enterprise server pod
    default: "256Mi"
  vaultResourcesLimitsCpu:
    type: string
    title: Vault Enterprise CPU Limit
    description: CPU limit for Vault Enterprise server pod
    default: "2000m"
  vaultResourcesLimitsMemory:
    type: string
    title: Vault Enterprise Memory Limit
    description: Memory limit for Vault Enterprise server pod
    default: "1Gi"

  # Vault Enterprise license (required)
  vaultLicense:
    type: string
    title: Vault Enterprise License
    description: Vault Enterprise license string (contents of your .hclic file)
    x-google-marketplace:
      type: MASKED_FIELD

  # Usage reporting secret (required for billing)
  reportingSecret:
    type: string
    x-google-marketplace:
      type: REPORTING_SECRET

required:
  - name
  - namespace
  - storageSize
  - vaultLicense
  - reportingSecret
